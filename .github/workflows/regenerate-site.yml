name: Regenerate Site Content

# Manual only — the "Run workflow" button on the Actions tab. Never triggered by the
# client; the admin panel only ever writes to Firestore, never to GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run regenerate script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/regenerate.mjs

      - name: Commit and push if index.html changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to index.html — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenerate site content from Firestore (Field Notes, Research, Labs)"
          git push
